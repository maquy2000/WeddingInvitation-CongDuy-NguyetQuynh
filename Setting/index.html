<!doctype html>
<html lang="vi">
<head>
  <link rel="icon" type="image/png" href="../assets/images/icon/heart.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Cài đặt thiệp cưới</title>
  <style>
    :root {
      --bg: #faf5ef;
      --card: #fffdfa;
      --text: #4d362a;
      --muted: #8d6f60;
      --gold: #bd8b4b;
      --border: rgba(189, 139, 75, 0.3);
      --danger: #b0473c;
      --ok: #3d7a4a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(255, 253, 250, 0.96);
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 18px; margin: 0 auto 0 0; }

    #status { width: 100%; margin: 0; color: var(--muted); font-size: 13px; }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--danger); }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 20px 16px 80px;
      display: grid;
      gap: 16px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    nav a {
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      background: var(--card);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      scroll-margin-top: 110px;
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      margin: 0 0 12px;
    }

    .card h2 label { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); }
    .card.off > :not(h2) { opacity: 0.45; }
    .card .note { color: var(--muted); margin: 0 0 12px; }

    .families { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px 16px;
    }

    .field { display: grid; gap: 4px; align-content: start; }
    .field.wide { grid-column: 1 / -1; }
    .field > span { font-weight: 600; }
    .field.check { display: flex; align-items: center; gap: 8px; }

    input[type="text"], input[type="number"], input[type="datetime-local"], textarea, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 60px; }

    .picker { display: flex; gap: 8px; align-items: center; }
    .picker input { flex: 1; min-width: 0; }

    .thumb {
      width: 56px;
      height: 56px;
      flex: none;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f3ece4;
    }

    .thumb.missing { outline: 2px solid var(--danger); }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      background: #fff;
      color: var(--text);
      white-space: nowrap;
    }

    button:hover { border-color: var(--gold); }
    button.primary { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 700; }
    button.danger { color: var(--danger); }

    .album-list { display: grid; gap: 8px; margin: 12px 0; }

    .album-row {
      display: grid;
      grid-template-columns: 28px 1fr 200px 110px auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .album-row.hidden-by-limit { opacity: 0.5; }
    .album-row .index { text-align: center; color: var(--muted); font-weight: 700; }
    .album-row .actions { display: flex; gap: 4px; }
    .album-row .actions button { padding: 6px 9px; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    @media (max-width: 760px) {
      .families { grid-template-columns: 1fr; }
      .album-row { grid-template-columns: 1fr; }
      .album-row .index { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Cài đặt thiệp cưới</h1>
    <button id="pickFolder" type="button">Chọn thư mục project</button>
    <button id="reload" type="button">Tải lại từ file</button>
    <button id="importData" type="button" title="Nhận file sao lưu .json đã xuất (kèm ảnh/nhạc) hoặc file config-setting.js">Nhập dữ liệu…</button>
    <button id="exportData" type="button" title="Tải 1 file sao lưu gồm dữ liệu và mọi ảnh/nhạc đang dùng">Xuất dữ liệu</button>
    <button id="save" class="primary" type="button">Lưu &amp; cập nhật 2 thiệp</button>
    <p id="status">Đang tải cấu hình...</p>
  </header>

  <main>
    <nav id="toc"></nav>
    <div id="form"></div>
    <p class="note">
      Xem kết quả: <a href="../Groom/" target="_blank">Thiệp nhà trai</a> ·
      <a href="../Bride/" target="_blank">Thiệp nhà gái</a> ·
      <a href="../" target="_blank">Trang chọn thiệp</a>
    </p>
  </main>

  <datalist id="imageFiles"></datalist>
  <datalist id="audioFiles"></datalist>

  <script src="../assets/js/setting-model.js"></script>
  <script src="../assets/js/setting.js"></script>
</body>
</html>
