<!doctype html>
<html lang="vi">
<head>
  <link rel="icon" type="image/png" href="../assets/images/icon/heart.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">Thiệp Cưới</title>
  <meta id="pageDescription" name="description" content="Thiệp cưới online" />
  <link rel="stylesheet" href="../assets/css/style.css?v=20261122" />
  <link rel="stylesheet" href="../assets/css/template-vintage.css?v=20261122" />
</head>
<body>
  <audio id="bgMusic" loop preload="none"></audio>

  <section id="cover" class="cover-screen">
    <img id="coverImage" class="cover-image" src="" alt="Ảnh bìa thiệp cưới" />
    <div class="cover-overlay"></div>
    <div class="cover-content">
      <p id="coverEyebrow" class="script-title">Wedding Invitation</p>
      <div class="ornament">❦</div>
      <h1 class="cover-names">
        <span id="coverName1"></span>
        <span class="amp">&amp;</span>
        <span id="coverName2"></span>
      </h1>
      <p id="coverDate" class="date"></p>
      <p id="coverDescription" class="guest-line"></p>
      <button id="openInvite" class="primary-btn">Mở thiệp</button>
    </div>
  </section>

  <main id="mainContent" class="main-content hidden">
    <div class="floating-controls">
      <button id="musicToggle" class="round-btn" type="button" aria-label="Bật/tắt nhạc">♫</button>
      <button id="autoScrollToggle" class="round-btn" type="button" aria-label="Tự cuộn trang">⇣</button>
    </div>

    <section id="home" class="section hero panel-card">
      <p id="heroEyebrow" class="eyebrow">Wedding Invitation</p>
      <h2><span id="heroName1"></span> <span class="amp-inline">&amp;</span> <span id="heroName2"></span></h2>
      <p id="heroDate" class="hero-date"></p>
      <p id="heroDescription" class="hero-desc"></p>
      <div id="countdown" class="countdown">
        <div><strong id="days">0</strong><span>Ngày</span></div>
        <div><strong id="hours">0</strong><span>Giờ</span></div>
        <div><strong id="minutes">0</strong><span>Phút</span></div>
        <div><strong id="seconds">0</strong><span>Giây</span></div>
      </div>
      <div id="calendar" class="calendar"></div>
      <a class="outline-btn" href="#story">Xem tiếp</a>
    </section>

    <section id="story" class="section two-col">
      <div class="photo-frame tall">
        <img id="coupleImage" src="" alt="Ảnh cô dâu chú rể" />
      </div>
      <div id="invitation" class="panel-card content-card invitation-side">
        <p id="invitationEyebrow" class="eyebrow">Together With Our Families</p>
        <h3 id="invitationTitle">Tiệc cưới</h3>
        <p id="invitationDescription">Chúng tôi trân trọng kính mời bạn đến tham dự lễ cưới và chung vui cùng gia đình.</p>

        <div id="inviteGrid" class="invite-grid"></div>
      </div>
    </section>

    <section id="event" class="section">
      <div class="section-heading panel-card">
        <p id="eventEyebrow" class="eyebrow"></p>
        <h3 id="eventTitle"></h3>
      </div>
      <div id="eventGrid" class="event-grid"></div>
    </section>

    <section id="album" class="section">
      <div class="section-heading panel-card">
        <p id="albumEyebrow" class="eyebrow"></p>
        <h3 id="albumTitle"></h3>
      </div>
      <div id="albumGrid" class="album-grid"></div>
    </section>

    <section id="gift" class="section two-col reverse">
      <div class="panel-card content-card gift-card">
        <p id="giftEyebrow" class="eyebrow"></p>
        <h3 id="giftTitle"></h3>
        <p id="giftDescription"></p>
        <p class="gift-ornament" aria-hidden="true">✦ ✦ ✦ ✦</p>
        <!-- Hộp quà: bấm vào thì nắp bật lên, mở hộp thoại có mã QR / số tài khoản (app.js).
             Quanh hộp chính là hộp quà nhỏ, hoa lá, tim bay, sao lấp lánh (chỉ để trang trí, màu theo mẫu qua biến --gift-*). -->
        <button id="giftBox" class="gift-box" type="button" aria-label="Mở hộp quà mừng cưới">
          <span class="gift-burst" aria-hidden="true">
            <i style="--dx: -70px; --dy: -80px"></i><i style="--dx: 70px; --dy: -86px"></i>
            <i style="--dx: -96px; --dy: -24px"></i><i style="--dx: 98px; --dy: -30px"></i>
            <i style="--dx: -30px; --dy: -110px"></i><i style="--dx: 34px; --dy: -112px"></i>
            <i style="--dx: -62px; --dy: 10px"></i><i style="--dx: 64px; --dy: 6px"></i>
          </span>
          <svg class="gift-svg" viewBox="0 0 300 280" aria-hidden="true">
            <defs>
              <radialGradient id="gift-glow">
                <stop offset="0" style="stop-color: var(--gift-glow)" />
                <stop offset="1" style="stop-color: var(--gift-glow); stop-opacity: 0" />
              </radialGradient>
              <radialGradient id="gift-floor">
                <stop offset="0" stop-color="#000" stop-opacity="0.3" />
                <stop offset="1" stop-color="#000" stop-opacity="0" />
              </radialGradient>
              <!-- Hộp quà nhỏ: màu hộp --mb, màu nơ --mr (đặt ở thẻ use). -->
              <symbol id="gift-mini" viewBox="0 0 60 64">
                <rect x="8" y="28" width="44" height="33" rx="3" style="fill: var(--mb); stroke: #000; stroke-opacity: 0.12; stroke-width: 1.2" />
                <g style="fill: #fff; opacity: 0.5">
                  <circle cx="15" cy="37" r="1.7" /><circle cx="19" cy="52" r="1.4" /><circle cx="42" cy="38" r="1.4" /><circle cx="46" cy="53" r="1.7" />
                </g>
                <path d="M38 28h11a3 3 0 0 1 3 3v27a3 3 0 0 1-3 3H38Z" style="fill: #000; opacity: 0.08" />
                <rect x="27" y="28" width="6" height="33" style="fill: var(--mr)" />
                <rect x="5" y="20" width="50" height="11" rx="2.5" style="fill: var(--mb); stroke: #000; stroke-opacity: 0.12; stroke-width: 1.2" />
                <rect x="5" y="28" width="50" height="3" style="fill: #000; opacity: 0.08" />
                <rect x="26" y="20" width="8" height="11" style="fill: var(--mr)" />
                <path d="M30 20C25 9 13 10 16 17c2 4 9 4 14 3ZM30 20C35 9 47 10 44 17c-2 4-9 4-14 3Z" style="fill: var(--mr)" />
                <circle cx="30" cy="20" r="3.6" style="fill: var(--mr)" />
                <circle cx="30" cy="20" r="3.6" style="fill: #000; opacity: 0.15" />
              </symbol>
              <!-- Hoa 5 cánh: màu cánh --fl, nhụy --fc. Lá: màu --lf. -->
              <symbol id="gift-flower" viewBox="0 0 24 24">
                <g style="fill: var(--fl)">
                  <circle cx="12" cy="6" r="4.6" /><circle cx="17.7" cy="10.1" r="4.6" /><circle cx="15.5" cy="16.9" r="4.6" />
                  <circle cx="8.5" cy="16.9" r="4.6" /><circle cx="6.3" cy="10.1" r="4.6" />
                </g>
                <circle cx="12" cy="12" r="3.2" style="fill: var(--fc)" />
              </symbol>
              <symbol id="gift-leaf" viewBox="0 0 30 14">
                <path d="M1 7C8-1 22-1 29 7 22 15 8 15 1 7Z" style="fill: var(--lf)" />
                <path d="M4 7H26" style="fill: none; stroke: #fff; stroke-opacity: 0.45" />
              </symbol>
              <path id="gift-star" d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z" />
              <path id="gift-heart" d="M0 6C-5 2-8-.6-8-3.8-8-6.3-6.1-8.2-3.7-8.2-2.2-8.2-.8-7.4 0-6.2.8-7.4 2.2-8.2 3.7-8.2 6.1-8.2 8-6.3 8-3.8 8-.6 5 2 0 6Z" />
            </defs>

            <circle class="gift-glow" cx="150" cy="146" r="130" fill="url(#gift-glow)" />
            <circle class="gift-ring" cx="150" cy="146" r="112" />
            <ellipse class="gift-floor" cx="150" cy="226" rx="92" ry="10" fill="url(#gift-floor)" />

            <!-- Phía sau hộp chính -->
            <g transform="translate(44 92) rotate(-14)"><use class="gift-mini" href="#gift-mini" x="-22" y="-23" width="44" height="47" style="--mb: #dccbf2; --mr: #8f6fcf; --d: 0s" /></g>
            <g transform="translate(258 86) rotate(12)"><use class="gift-mini" href="#gift-mini" x="-23" y="-25" width="46" height="49" style="--mb: #cde1f4; --mr: #5f8fc2; --d: 0.5s" /></g>
            <g transform="translate(34 170) rotate(-8)"><use class="gift-mini" href="#gift-mini" x="-17" y="-18" width="34" height="36" style="--mb: #f6cdd3; --mr: #d9808f; --d: 1s" /></g>
            <g transform="translate(268 164) rotate(10)"><use class="gift-mini" href="#gift-mini" x="-16" y="-17" width="32" height="34" style="--mb: #d6e4ca; --mr: #5f8550; --d: 1.5s" /></g>
            <g transform="translate(122 118)"><use class="gift-float" href="#gift-heart" style="--d: 0s" /></g>
            <g transform="translate(178 112)"><use class="gift-float" href="#gift-heart" style="--d: 1.3s" /></g>
            <g transform="translate(150 104)"><use class="gift-float" href="#gift-heart" style="--d: 2.5s" /></g>

            <!-- Hộp chính -->
            <g transform="translate(50 40)">
              <g class="gift-main">
                <rect class="gb-box" x="38" y="98" width="124" height="86" rx="8" />
                <g class="gb-dots">
                  <circle cx="54" cy="114" r="3" /><circle cx="74" cy="134" r="2.2" /><circle cx="52" cy="154" r="2.6" />
                  <circle cx="78" cy="170" r="2" /><circle cx="64" cy="126" r="1.4" /><circle cx="128" cy="116" r="2.2" />
                  <circle cx="148" cy="134" r="3" /><circle cx="126" cy="152" r="1.8" /><circle cx="150" cy="170" r="2.4" />
                </g>
                <path class="gb-shade" d="M120 98H154a8 8 0 0 1 8 8V176a8 8 0 0 1-8 8H120Z" />
                <rect class="gb-ribbon" x="91" y="98" width="18" height="86" />
                <g class="gift-lid">
                  <rect class="gb-lid" x="30" y="76" width="140" height="28" rx="6" />
                  <rect class="gb-shine" x="36" y="80" width="128" height="5" rx="2.5" />
                  <rect class="gb-ribbon" x="89" y="76" width="22" height="28" />
                  <path class="gb-ribbon" d="M100 76C86 48 54 50 62 70 67 81 88 80 100 76Z" />
                  <path class="gb-ribbon" d="M100 76C114 48 146 50 138 70 133 81 112 80 100 76Z" />
                  <path class="gb-knot" d="M100 76C92 62 74 62 76 70 78 76 92 78 100 76ZM100 76C108 62 126 62 124 70 122 76 108 78 100 76Z" />
                  <path class="gb-string" d="M106 82C116 92 121 100 123 110" />
                  <path class="gb-tag" transform="translate(115 108) rotate(14)" d="M8 15C3 11 0 8.4 0 5 0 2.2 2.1 0 4.6 0 6.1 0 7.3.8 8 2 8.7.8 9.9 0 11.4 0 13.9 0 16 2.2 16 5 16 8.4 13 11 8 15Z" />
                  <ellipse class="gb-knot" cx="100" cy="76" rx="10" ry="8" />
                </g>
              </g>
            </g>

            <!-- Phía trước: hộp nhỏ, hoa, lá -->
            <g transform="translate(40 250) rotate(-25)"><use href="#gift-leaf" x="-15" y="-7" width="30" height="14" style="--lf: #9db58a" /></g>
            <g transform="translate(262 252) rotate(200)"><use href="#gift-leaf" x="-15" y="-7" width="30" height="14" style="--lf: #9db58a" /></g>
            <g transform="translate(74 226) rotate(6)"><use class="gift-mini" href="#gift-mini" x="-24" y="-26" width="48" height="51" style="--mb: #f2e4c8; --mr: #c08f45; --d: 0.8s" /></g>
            <g transform="translate(230 230) rotate(-10)"><use class="gift-mini" href="#gift-mini" x="-21" y="-22" width="42" height="45" style="--mb: #f8efe2; --mr: #b23f48; --d: 1.8s" /></g>
            <g transform="translate(122 252) rotate(-6)"><use class="gift-mini" href="#gift-mini" x="-12" y="-13" width="24" height="26" style="--mb: #fbf5ea; --mr: #cfa76a; --d: 2.4s" /></g>
            <use href="#gift-flower" x="142" y="248" width="20" height="20" style="--fl: #f4b9c2; --fc: #e7b14a" />
            <use href="#gift-flower" x="164" y="256" width="14" height="14" style="--fl: #fff6ea; --fc: #e7b14a" />
            <use href="#gift-flower" x="190" y="250" width="16" height="16" style="--fl: #d9c9f0; --fc: #e7b14a" />

            <!-- Sao lấp lánh -->
            <g transform="translate(22 40)"><use class="gift-star" href="#gift-star" style="--d: 0s" /></g>
            <g transform="translate(284 36) scale(0.7)"><use class="gift-star" href="#gift-star" style="--d: 0.6s" /></g>
            <g transform="translate(96 40) scale(0.55)"><use class="gift-star" href="#gift-star" style="--d: 1.2s" /></g>
            <g transform="translate(212 52) scale(0.8)"><use class="gift-star" href="#gift-star" style="--d: 1.7s" /></g>
            <g transform="translate(12 126) scale(0.6)"><use class="gift-star" href="#gift-star" style="--d: 0.9s" /></g>
            <g transform="translate(292 128) scale(0.6)"><use class="gift-star" href="#gift-star" style="--d: 2.1s" /></g>
          </svg>
          <span class="gift-hint">Nhấn để mở</span>
        </button>
      </div>
      <div id="giftPhoto" class="photo-frame">
        <img id="giftImage" src="" alt="Ảnh lời chúc" />
      </div>
    </section>

    <section id="rsvp" class="section">
      <div class="section-heading panel-card">
        <p class="eyebrow">RSVP</p>
        <h3>Xác nhận tham dự</h3>
      </div>
      <div class="rsvp-layout">
        <form id="rsvpForm" class="panel-card rsvp-form">
          <label>Họ tên<input name="name" required placeholder="Nhập tên của bạn" /></label>
          <label>Số khách<input name="guests" type="number" min="1" value="1" required /></label>
          <label>Bạn sẽ tham dự?
            <select name="status">
              <option value="Có tham dự">Có tham dự</option>
              <option value="Chưa chắc">Chưa chắc</option>
              <option value="Không tham dự">Không tham dự</option>
            </select>
          </label>
          <label>Lời chúc<textarea name="message" rows="4" placeholder="Gửi lời chúc đến cô dâu chú rể"></textarea></label>
          <button class="primary-btn" type="submit">Gửi xác nhận</button>
        </form>
        <div class="panel-card guest-box">
          <h4>Danh sách xác nhận local</h4>
          <ul id="guestList"></ul>
          <div class="button-row">
            <button id="exportRsvp" type="button" class="outline-btn">Tải RSVP JSON</button>
            <button id="clearRsvp" type="button" class="danger-btn">Xóa dữ liệu</button>
          </div>
        </div>
      </div>
    </section>

    <section id="thanks" class="section thanks">
      <div class="panel-card thanks-card">
        <p class="eyebrow">Thank You</p>
        <h3 id="thanksTitle"></h3>
        <p id="thanksMessage"></p>
      </div>
    </section>
  </main>

  <dialog id="lightbox">
    <button id="closeLightbox" class="close-btn" type="button" aria-label="Đóng ảnh lớn">×</button>
    <img id="lightboxImage" alt="Ảnh xem lớn" />
  </dialog>

  <dialog id="giftDialog" class="gift-dialog">
    <div class="gift-dialog-head">
      <h4 id="bankTitle"></h4>
      <button id="closeGift" class="gift-close" type="button" aria-label="Đóng">✕</button>
    </div>
    <div id="giftAccounts" class="gift-accounts"></div>
  </dialog>

  <script src="../assets/js/config-setting.js?v=20261122"></script>
  <script src="../assets/js/setting-model.js?v=20261122"></script>
  <script src="../assets/js/config-groom.js?v=20261122"></script>
  <script src="../assets/js/app.js?v=20261122"></script>
</body>
</html>
